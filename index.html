<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title></title>

  <style>
    :root {
      --c1: 255, 213, 187;
      --c2: 190, 205, 255;
      --c3: 240, 184, 218;
      --c4: 180, 229, 216;

      --mx: 50%;
      --my: 50%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      background: #ece8e3;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      background: #ece8e3;
    }

    /* =========================
       FIXED VISUAL WORLD
    ========================== */

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      pointer-events: none;
      background:
        linear-gradient(
          145deg,
          rgb(var(--c1)),
          rgb(var(--c2))
        );
    }

    /* Main fluid color field */
    .aurora {
      position: absolute;
      inset: -25%;
      width: 150%;
      height: 150%;

      background:
        radial-gradient(
          circle at 22% 25%,
          rgba(var(--c1), 0.95) 0%,
          rgba(var(--c1), 0.4) 24%,
          transparent 49%
        ),

        radial-gradient(
          circle at 78% 29%,
          rgba(var(--c2), 0.94) 0%,
          rgba(var(--c2), 0.36) 26%,
          transparent 52%
        ),

        radial-gradient(
          circle at 66% 75%,
          rgba(var(--c3), 0.92) 0%,
          rgba(var(--c3), 0.32) 26%,
          transparent 53%
        ),

        radial-gradient(
          circle at 25% 79%,
          rgba(var(--c4), 0.88) 0%,
          rgba(var(--c4), 0.3) 25%,
          transparent 52%
        ),

        linear-gradient(
          135deg,
          rgb(var(--c1)),
          rgb(var(--c4))
        );

      filter: blur(45px) saturate(115%);
      transform: scale(1.08);

      animation:
        breathe 14s ease-in-out infinite alternate,
        rotateWorld 38s linear infinite;
    }

    /* Secondary glass-like atmospheric layer */
    .mist {
      position: absolute;
      inset: -20%;
      width: 140%;
      height: 140%;

      background:
        radial-gradient(
          ellipse at 35% 35%,
          rgba(255, 255, 255, 0.33),
          transparent 30%
        ),

        radial-gradient(
          ellipse at 70% 65%,
          rgba(255, 255, 255, 0.18),
          transparent 36%
        );

      mix-blend-mode: soft-light;
      filter: blur(35px);

      animation: mistDrift 22s ease-in-out infinite alternate;
    }

    /* Interactive cursor light */
    .light {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at var(--mx) var(--my),
          rgba(255, 255, 255, 0.72) 0%,
          rgba(255, 255, 255, 0.38) 7%,
          rgba(255, 255, 255, 0.12) 17%,
          transparent 34%
        );

      mix-blend-mode: soft-light;
    }

    /* Subtle highlight around interactive light */
    .halo {
      position: absolute;
      left: var(--mx);
      top: var(--my);

      width: 36vw;
      height: 36vw;
      min-width: 280px;
      min-height: 280px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.03) 48%,
          transparent 72%
        );

      filter: blur(12px);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Film grain makes gradients feel less synthetic */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.05;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");

      mix-blend-mode: soft-light;
    }

    /* Soft edge darkening */
    .vignette {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(30, 25, 35, 0.05) 100%
        );
    }

    /* =========================
       INVISIBLE SCROLL SPACE
    ========================== */

    main {
      position: relative;
      z-index: 2;
    }

    section {
      height: 100svh;
      width: 100%;
    }

    /* Small visual cue that there is more below.
       No text, just a faint line.
    */
    .scroll-mark {
      position: fixed;
      z-index: 4;

      bottom: 26px;
      left: 50%;

      width: 1px;
      height: 38px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.55),
          transparent
        );

      pointer-events: none;

      animation: scrollPulse 2.4s ease-in-out infinite;
      transition: opacity 0.6s ease;
    }

    /* =========================
       ANIMATION
    ========================== */

    @keyframes breathe {
      0% {
        transform: scale(1.08) translate(-1%, -1%);
      }

      50% {
        transform: scale(1.14) translate(2%, -2%);
      }

      100% {
        transform: scale(1.1) translate(-2%, 2%);
      }
    }

    @keyframes rotateWorld {
      from {
        rotate: 0deg;
      }

      to {
        rotate: 360deg;
      }
    }

    @keyframes mistDrift {
      0% {
        transform: translate(-4%, -2%) rotate(-3deg);
      }

      100% {
        transform: translate(5%, 4%) rotate(4deg);
      }
    }

    @keyframes scrollPulse {
      0%,
      100% {
        opacity: 0.16;
        transform: translateX(-50%) scaleY(0.7);
      }

      50% {
        opacity: 0.7;
        transform: translateX(-50%) scaleY(1);
      }
    }

    @media (max-width: 700px) {
      .aurora {
        filter: blur(30px) saturate(110%);
      }

      .halo {
        width: 70vw;
        height: 70vw;
      }

      .scroll-mark {
        bottom: 20px;
        height: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora,
      .mist,
      .scroll-mark {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div id="stage">

    <div class="aurora" id="aurora"></div>

    <div class="mist"></div>

    <canvas id="canvas"></canvas>

    <div class="light"></div>
    <div class="halo"></div>

    <div class="grain"></div>
    <div class="vignette"></div>

  </div>

  <div class="scroll-mark" id="scrollMark"></div>

  <!--
    These sections contain nothing.
    Their only purpose is to create four visual "chapters."
  -->
  <main>
    <section></section>
    <section></section>
    <section></section>
    <section></section>
  </main>


  <script>
    /* =========================================================
       COLOR WORLDS

       Scrolling slowly transitions among these palettes.
    ========================================================== */

    const palettes = [
      [
        [255, 215, 187],
        [190, 206, 255],
        [239, 184, 218],
        [180, 228, 215]
      ],

      [
        [174, 205, 255],
        [205, 187, 247],
        [253, 203, 221],
        [183, 233, 224]
      ],

      [
        [248, 193, 168],
        [244, 217, 171],
        [202, 183, 236],
        [170, 210, 223]
      ],

      [
        [177, 215, 206],
        [187, 202, 247],
        [232, 192, 219],
        [250, 221, 185]
      ]
    ];


    const root = document.documentElement;


    function lerp(a, b, amount) {
      return a + (b - a) * amount;
    }


    function mixColor(a, b, amount) {
      return [
        Math.round(lerp(a[0], b[0], amount)),
        Math.round(lerp(a[1], b[1], amount)),
        Math.round(lerp(a[2], b[2], amount))
      ];
    }


    function updateScrollColors() {

      const maxScroll =
        document.documentElement.scrollHeight - window.innerHeight;

      const progress =
        maxScroll > 0
          ? window.scrollY / maxScroll
          : 0;

      const position =
        progress * (palettes.length - 1);

      const current =
        Math.min(
          palettes.length - 2,
          Math.floor(position)
        );

      const amount =
        Math.min(1, position - current);


      for (let i = 0; i < 4; i++) {

        const color =
          mixColor(
            palettes[current][i],
            palettes[current + 1][i],
            amount
          );

        root.style.setProperty(
          `--c${i + 1}`,
          color.join(",")
        );
      }


      /* Hide the scroll indicator once they understand the page */
      const mark = document.getElementById("scrollMark");

      mark.style.opacity =
        progress > 0.08 ? "0" : "1";
    }


    window.addEventListener(
      "scroll",
      updateScrollColors,
      { passive: true }
    );


    updateScrollColors();



    /* =========================================================
       INTERACTIVE LIGHT

       Mouse:
       follows movement
       returns to center after inactivity

       Touch:
       follows finger
       returns when finger stops or lifts
    ========================================================== */

    let targetX = 50;
    let targetY = 50;

    let currentX = 50;
    let currentY = 50;

    let interacting = false;
    let touchActive = false;

    let idleTimer = null;


    function startIdleTimer(isTouch = false) {

      clearTimeout(idleTimer);

      const delay =
        isTouch ? 500 : 1200;

      idleTimer =
        setTimeout(() => {

          interacting = false;

          targetX = 50;
          targetY = 50;

        }, delay);
    }


    function setPointerPosition(x, y, isTouch = false) {

      interacting = true;

      targetX =
        (x / window.innerWidth) * 100;

      targetY =
        (y / window.innerHeight) * 100;

      startIdleTimer(isTouch);
    }


    window.addEventListener(
      "pointermove",
      event => {

        if (
          event.pointerType === "touch" &&
          !touchActive
        ) return;

        setPointerPosition(
          event.clientX,
          event.clientY,
          event.pointerType === "touch"
        );
      },
      { passive: true }
    );


    window.addEventListener(
      "pointerdown",
      event => {

        if (event.pointerType === "touch") {
          touchActive = true;
        }

        setPointerPosition(
          event.clientX,
          event.clientY,
          event.pointerType === "touch"
        );

        createRipple(
          event.clientX,
          event.clientY
        );
      },
      { passive: true }
    );


    window.addEventListener(
      "pointerup",
      event => {

        if (event.pointerType === "touch") {

          touchActive = false;

          clearTimeout(idleTimer);

          interacting = false;

          targetX = 50;
          targetY = 50;
        }
      },
      { passive: true }
    );


    window.addEventListener(
      "pointercancel",
      () => {

        touchActive = false;

        interacting = false;

        targetX = 50;
        targetY = 50;
      }
    );


    window.addEventListener(
      "mouseout",
      event => {

        if (!event.relatedTarget) {

          interacting = false;

          targetX = 50;
          targetY = 50;
        }
      }
    );


    function animateLight() {

      /*
        Responsive while interacting.
        Dreamier and slower while returning home.
      */

      const speed =
        interacting ? 0.14 : 0.028;


      currentX +=
        (targetX - currentX) * speed;

      currentY +=
        (targetY - currentY) * speed;


      root.style.setProperty(
        "--mx",
        currentX + "%"
      );

      root.style.setProperty(
        "--my",
        currentY + "%"
      );


      requestAnimationFrame(animateLight);
    }


    animateLight();



    /* =========================================================
       PARTICLE FIELD
    ========================================================== */

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");


    let width;
    let height;
    let dpr;

    let particles = [];

    let ripples = [];


    function resizeCanvas() {

      dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      width =
        window.innerWidth;

      height =
        window.innerHeight;


      canvas.width =
        width * dpr;

      canvas.height =
        height * dpr;


      canvas.style.width =
        width + "px";

      canvas.style.height =
        height + "px";


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );


      createParticles();
    }



    function createParticles() {

      particles = [];

      const amount =
        width < 700 ? 48 : 85;


      for (let i = 0; i < amount; i++) {

        particles.push({

          x:
            Math.random() * width,

          y:
            Math.random() * height,

          originX:
            Math.random() * width,

          originY:
            Math.random() * height,

          radius:
            Math.random() * 1.3 + 0.4,

          speed:
            Math.random() * 0.003 + 0.001,

          offset:
            Math.random() * Math.PI * 2,

          range:
            Math.random() * 35 + 10

        });
      }
    }



    /* =========================================================
       CLICK / TAP RIPPLES
    ========================================================== */

    function createRipple(x, y) {

      ripples.push({

        x,
        y,

        radius: 4,

        opacity: 0.28,

        speed:
          2.5 + Math.random() * 1.5

      });


      if (ripples.length > 8) {
        ripples.shift();
      }
    }



    /* =========================================================
       DRAW WORLD
    ========================================================== */

    function draw(time) {

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      const t =
        time * 0.001;


      /* -----------------------
         PARTICLE MOVEMENT
      ------------------------ */

      for (
        let i = 0;
        i < particles.length;
        i++
      ) {

        const p =
          particles[i];


        p.x +=
          Math.cos(
            t * 0.45 +
            p.offset
          ) * 0.13;

        p.y +=
          Math.sin(
            t * 0.38 +
            p.offset
          ) * 0.13;


        /*
          Very subtle attraction toward
          the active light position.
        */

        const pointerX =
          currentX / 100 * width;

        const pointerY =
          currentY / 100 * height;


        const dx =
          pointerX - p.x;

        const dy =
          pointerY - p.y;

        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        if (distance < 260) {

          const force =
            (260 - distance) / 260;

          p.x +=
            dx * force * 0.0007;

          p.y +=
            dy * force * 0.0007;
        }


        /* keep particles onscreen */

        if (p.x < -20) p.x = width + 20;
        if (p.x > width + 20) p.x = -20;

        if (p.y < -20) p.y = height + 20;
        if (p.y > height + 20) p.y = -20;
      }



      /* -----------------------
         CONNECTIONS
      ------------------------ */

      for (
        let i = 0;
        i < particles.length;
        i++
      ) {

        for (
          let j = i + 1;
          j < particles.length;
          j++
        ) {

          const a =
            particles[i];

          const b =
            particles[j];


          const dx =
            a.x - b.x;

          const dy =
            a.y - b.y;

          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          const maxDistance =
            width < 700 ? 85 : 115;


          if (distance < maxDistance) {

            const opacity =
              (1 - distance / maxDistance)
              * 0.085;


            ctx.beginPath();

            ctx.moveTo(
              a.x,
              a.y
            );

            ctx.lineTo(
              b.x,
              b.y
            );

            ctx.strokeStyle =
              `rgba(255,255,255,${opacity})`;

            ctx.lineWidth =
              0.7;

            ctx.stroke();
          }
        }
      }



      /* -----------------------
         PARTICLES
      ------------------------ */

      for (const p of particles) {

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.radius,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          "rgba(255,255,255,0.3)";

        ctx.fill();
      }



      /* -----------------------
         RIPPLES
      ------------------------ */

      for (
        let i = ripples.length - 1;
        i >= 0;
        i--
      ) {

        const ripple =
          ripples[i];


        ripple.radius +=
          ripple.speed;

        ripple.opacity *=
          0.975;


        ctx.beginPath();

        ctx.arc(
          ripple.x,
          ripple.y,
          ripple.radius,
          0,
          Math.PI * 2
        );


        ctx.strokeStyle =
          `rgba(255,255,255,${ripple.opacity})`;

        ctx.lineWidth =
          1;

        ctx.stroke();


        /*
          A second softer ring
          trails behind.
        */

        if (ripple.radius > 18) {

          ctx.beginPath();

          ctx.arc(
            ripple.x,
            ripple.y,
            ripple.radius * 0.68,
            0,
            Math.PI * 2
          );

          ctx.strokeStyle =
            `rgba(255,255,255,${
              ripple.opacity * 0.45
            })`;

          ctx.lineWidth =
            0.7;

          ctx.stroke();
        }


        if (
          ripple.opacity < 0.008
        ) {
          ripples.splice(i, 1);
        }
      }


      requestAnimationFrame(draw);
    }



    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();

    requestAnimationFrame(draw);

  </script>

</body>
</html>
