<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      position: relative;
      touch-action: none;
    }

    .gradient {
      position: absolute;
      inset: -30%;
      width: 160%;
      height: 160%;

      background:
        radial-gradient(
          circle at var(--x, 50%) var(--y, 50%),
          rgba(255, 220, 190, 0.95),
          transparent 28%
        ),
        radial-gradient(
          circle at 25% 30%,
          rgba(195, 210, 255, 0.9),
          transparent 35%
        ),
        radial-gradient(
          circle at 75% 65%,
          rgba(235, 190, 220, 0.9),
          transparent 38%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(180, 225, 215, 0.8),
          transparent 40%
        ),
        #ebe7e2;

      filter: blur(35px);

      animation: drift 18s ease-in-out infinite alternate;

      transform: scale(1.1);
      will-change: transform;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;

      background-image: url(
        "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E"
      );
    }

    @keyframes drift {
      0% {
        transform: scale(1.1) translate(-2%, -2%) rotate(0deg);
      }

      50% {
        transform: scale(1.18) translate(3%, 1%) rotate(3deg);
      }

      100% {
        transform: scale(1.12) translate(-1%, 4%) rotate(-2deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gradient {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="gradient" id="gradient"></div>
  <div class="grain"></div>

  <script>
    const gradient = document.getElementById("gradient");

    let currentX = 50;
    let currentY = 50;

    let targetX = 50;
    let targetY = 50;

    let inactivityTimer = null;
    let isInteracting = false;

    // How long the cursor/finger can stay still
    // before the glow begins drifting back to center.
    const idleDelay = 1200;

    // How quickly the glow catches up while interacting.
    const followSpeed = 0.16;

    // How gently it returns to center.
    const returnSpeed = 0.045;

    function returnToCenter() {
      isInteracting = false;
      targetX = 50;
      targetY = 50;
    }

    function restartIdleTimer(delay = idleDelay) {
      clearTimeout(inactivityTimer);

      inactivityTimer = setTimeout(() => {
        returnToCenter();
      }, delay);
    }

    function updateTarget(clientX, clientY) {
      isInteracting = true;

      targetX = (clientX / window.innerWidth) * 100;
      targetY = (clientY / window.innerHeight) * 100;

      restartIdleTimer();
    }

    function animate() {
      const speed = isInteracting
        ? followSpeed
        : returnSpeed;

      currentX += (targetX - currentX) * speed;
      currentY += (targetY - currentY) * speed;

      gradient.style.setProperty(
        "--x",
        `${currentX}%`
      );

      gradient.style.setProperty(
        "--y",
        `${currentY}%`
      );

      requestAnimationFrame(animate);
    }

    // -------------------------
    // DESKTOP
    // -------------------------

    document.addEventListener("mousemove", (event) => {
      updateTarget(
        event.clientX,
        event.clientY
      );
    });

    // If the cursor leaves the browser window,
    // gently return the light to the center.
    document.addEventListener("mouseleave", () => {
      clearTimeout(inactivityTimer);
      returnToCenter();
    });

    // -------------------------
    // MOBILE / TOUCH
    // -------------------------

    document.addEventListener(
      "touchstart",
      (event) => {
        if (!event.touches.length) return;

        const touch = event.touches[0];

        updateTarget(
          touch.clientX,
          touch.clientY
        );
      },
      { passive: true }
    );

    document.addEventListener(
      "touchmove",
      (event) => {
        if (!event.touches.length) return;

        const touch = event.touches[0];

        updateTarget(
          touch.clientX,
          touch.clientY
        );
      },
      { passive: true }
    );

    // As soon as the finger is lifted,
    // begin drifting back toward center.
    document.addEventListener(
      "touchend",
      () => {
        clearTimeout(inactivityTimer);

        inactivityTimer = setTimeout(() => {
          returnToCenter();
        }, 150);
      },
      { passive: true }
    );

    document.addEventListener(
      "touchcancel",
      () => {
        clearTimeout(inactivityTimer);
        returnToCenter();
      },
      { passive: true }
    );

    // Start the continuous smooth animation.
    animate();
  </script>

</body>
</html>
