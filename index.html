<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>•</title>

  <style>
    :root {
      --bg: rgb(239, 235, 229);
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 400vh;
      background: var(--bg);
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
    }

    /* ---------------------------------
       COLOR FIELDS
    ---------------------------------- */

    .field {
      position: absolute;
      width: 70vmax;
      height: 70vmax;

      left: 50%;
      top: 50%;

      border-radius: 50%;

      filter: blur(75px);
      opacity: 0.72;

      will-change: transform, background;
      pointer-events: none;
    }

    #field1 {
      width: 75vmax;
      height: 75vmax;
      opacity: 0.72;
    }

    #field2 {
      width: 62vmax;
      height: 62vmax;
      opacity: 0.63;
    }

    #field3 {
      width: 72vmax;
      height: 72vmax;
      opacity: 0.55;
    }

    #field4 {
      width: 55vmax;
      height: 55vmax;
      opacity: 0.57;
    }

    #field5 {
      width: 68vmax;
      height: 68vmax;
      opacity: 0.48;
    }

    #field6 {
      width: 48vmax;
      height: 48vmax;
      opacity: 0.45;
    }

    /* ---------------------------------
       INTERACTIVE LIGHT
    ---------------------------------- */

    #light {
      position: absolute;

      width: 60vmax;
      height: 60vmax;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.80) 0%,
          rgba(255,255,255,0.32) 20%,
          rgba(255,255,255,0.10) 37%,
          rgba(255,255,255,0.00) 67%
        );

      mix-blend-mode: screen;

      filter: blur(9px);

      pointer-events: none;

      will-change: left, top;
    }

    /* ---------------------------------
       SUBTLE CENTER GLOW
    ---------------------------------- */

    #atmosphere {
      position: absolute;
      inset: -10%;

      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(255,255,255,0.26),
          transparent 36%
        );

      pointer-events: none;
    }

    /* ---------------------------------
       RIPPLE CANVAS
    ---------------------------------- */

    #ripples {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      mix-blend-mode: screen;
    }

    /* ---------------------------------
       VIGNETTE
    ---------------------------------- */

    #vignette {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(20, 20, 25, 0.035) 100%
        );

      pointer-events: none;
    }

    /* ---------------------------------
       FILM GRAIN
    ---------------------------------- */

    #grain {
      position: absolute;
      inset: -50%;

      width: 200%;
      height: 200%;

      opacity: 0.035;

      pointer-events: none;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");

      animation: grain 0.25s steps(2) infinite;
    }

    @keyframes grain {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(-2%, 1%);
      }

      50% {
        transform: translate(1%, -2%);
      }

      75% {
        transform: translate(2%, 2%);
      }

      100% {
        transform: translate(-1%, -1%);
      }
    }

    /* ---------------------------------
       INVISIBLE INTERACTION SURFACE
    ---------------------------------- */

    #interaction {
      position: absolute;
      inset: 0;

      z-index: 20;

      touch-action: pan-y;
    }

    @media (prefers-reduced-motion: reduce) {
      #grain {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div id="scene">

    <div class="field" id="field1"></div>
    <div class="field" id="field2"></div>
    <div class="field" id="field3"></div>
    <div class="field" id="field4"></div>
    <div class="field" id="field5"></div>
    <div class="field" id="field6"></div>

    <div id="atmosphere"></div>

    <div id="light"></div>

    <canvas id="ripples"></canvas>

    <div id="vignette"></div>
    <div id="grain"></div>

    <div id="interaction"></div>

  </div>


  <script>
    /* =========================================================
       SETUP
    ========================================================= */

    const fields = [
      document.getElementById("field1"),
      document.getElementById("field2"),
      document.getElementById("field3"),
      document.getElementById("field4"),
      document.getElementById("field5"),
      document.getElementById("field6")
    ];

    const light = document.getElementById("light");
    const interaction = document.getElementById("interaction");

    const canvas = document.getElementById("ripples");
    const ctx = canvas.getContext("2d");

    let width = window.innerWidth;
    let height = window.innerHeight;

    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    let reducedMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;


    /* =========================================================
       COLOR PALETTES

       Scrolling slowly moves between these worlds.
    ========================================================= */

    const palettes = [

      // 1 — Porcelain / sunrise
      {
        bg: [239, 235, 229],

        colors: [
          [243, 181, 176],   // coral
          [181, 198, 239],   // periwinkle
          [194, 226, 213],   // mint
          [244, 217, 174],   // gold
          [220, 187, 226],   // lavender
          [177, 220, 226]    // aqua
        ]
      },

      // 2 — Orchid / ocean
      {
        bg: [226, 227, 235],

        colors: [
          [174, 184, 239],
          [224, 176, 213],
          [155, 212, 218],
          [235, 192, 167],
          [184, 165, 222],
          [202, 225, 188]
        ]
      },

      // 3 — Twilight
      {
        bg: [49, 52, 72],

        colors: [
          [118, 100, 191],
          [179, 91, 159],
          [69, 152, 172],
          [225, 132, 119],
          [102, 119, 199],
          [85, 185, 163]
        ]
      },

      // 4 — Dream
      {
        bg: [225, 216, 225],

        colors: [
          [218, 157, 180],
          [151, 175, 227],
          [163, 217, 206],
          [229, 189, 145],
          [186, 155, 214],
          [137, 200, 220]
        ]
      }

    ];


    /* =========================================================
       HELPERS
    ========================================================= */

    function lerp(a, b, amount) {
      return a + (b - a) * amount;
    }

    function lerpColor(a, b, amount) {
      return [
        Math.round(lerp(a[0], b[0], amount)),
        Math.round(lerp(a[1], b[1], amount)),
        Math.round(lerp(a[2], b[2], amount))
      ];
    }

    function rgb(color) {
      return `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
    }


    /* =========================================================
       POINTER / TOUCH LIGHT
    ========================================================= */

    let pointer = {
      targetX: width / 2,
      targetY: height / 2,

      x: width / 2,
      y: height / 2,

      active: false,

      lastMove: performance.now(),

      idleStart: performance.now()
    };


    function activatePointer(x, y) {

      pointer.targetX = x;
      pointer.targetY = y;

      pointer.active = true;

      pointer.lastMove = performance.now();

    }


    interaction.addEventListener("pointermove", event => {

      activatePointer(
        event.clientX,
        event.clientY
      );

    });


    interaction.addEventListener("pointerdown", event => {

      activatePointer(
        event.clientX,
        event.clientY
      );

      createRipple(
        event.clientX,
        event.clientY
      );

    });


    interaction.addEventListener("pointerup", event => {

      if (event.pointerType === "touch") {

        pointer.active = false;
        pointer.idleStart = performance.now();

      }

    });


    interaction.addEventListener("pointercancel", () => {

      pointer.active = false;
      pointer.idleStart = performance.now();

    });


    interaction.addEventListener("pointerleave", event => {

      if (event.pointerType === "mouse") {

        pointer.active = false;
        pointer.idleStart = performance.now();

      }

    });


    /* =========================================================
       RIPPLE SYSTEM
    ========================================================= */

    const ripples = [];


    function createRipple(x, y) {

      ripples.push({

        x,
        y,

        radius: 4,

        opacity: 0.52,

        speed: 3 + Math.random() * 1.5,

        width: 1 + Math.random() * 1.2

      });


      // Tiny second ripple gives it more of a liquid feel.

      setTimeout(() => {

        ripples.push({

          x,
          y,

          radius: 2,

          opacity: 0.18,

          speed: 2.2,

          width: 0.8

        });

      }, 90);

    }


    function drawRipples() {

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      for (let i = ripples.length - 1; i >= 0; i--) {

        const ripple = ripples[i];

        ripple.radius += ripple.speed;

        ripple.speed *= 0.993;

        ripple.opacity *= 0.974;


        ctx.beginPath();

        ctx.arc(
          ripple.x,
          ripple.y,
          ripple.radius,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          `rgba(255,255,255,${ripple.opacity})`;

        ctx.lineWidth = ripple.width;

        ctx.stroke();


        if (ripple.opacity < 0.008) {

          ripples.splice(i, 1);

        }

      }

    }


    /* =========================================================
       CANVAS RESIZE
    ========================================================= */

    function resizeCanvas() {

      width = window.innerWidth;
      height = window.innerHeight;

      dpr = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

    }


    resizeCanvas();


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================================================
       FIELD MOTION CONFIGURATION
    ========================================================= */

    const fieldMotion = [

      {
        radiusX: 0.42,
        radiusY: 0.25,
        speed: 0.000080,
        phase: 0.2
      },

      {
        radiusX: 0.34,
        radiusY: 0.38,
        speed: 0.000063,
        phase: 1.7
      },

      {
        radiusX: 0.46,
        radiusY: 0.30,
        speed: 0.000051,
        phase: 3.1
      },

      {
        radiusX: 0.28,
        radiusY: 0.42,
        speed: 0.000094,
        phase: 4.4
      },

      {
        radiusX: 0.39,
        radiusY: 0.34,
        speed: 0.000058,
        phase: 5.6
      },

      {
        radiusX: 0.25,
        radiusY: 0.25,
        speed: 0.000108,
        phase: 2.5
      }

    ];


    /* =========================================================
       SCROLL / PALETTE
    ========================================================= */

    function getScrollState() {

      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

      const progress =
        maxScroll > 0
          ? window.scrollY / maxScroll
          : 0;


      const scaled =
        progress * (palettes.length - 1);


      const index =
        Math.min(
          Math.floor(scaled),
          palettes.length - 2
        );


      const mix =
        scaled - index;


      return {
        index,
        mix,
        progress
      };

    }


    /* =========================================================
       MAIN ANIMATION
    ========================================================= */

    function animate(time) {

      const scroll =
        getScrollState();


      /* -------------------------------
         COLORS
      -------------------------------- */

      const paletteA =
        palettes[scroll.index];

      const paletteB =
        palettes[scroll.index + 1];


      const background =
        lerpColor(
          paletteA.bg,
          paletteB.bg,
          scroll.mix
        );


      document.documentElement.style.setProperty(
        "--bg",
        rgb(background)
      );


      fields.forEach((field, i) => {

        const color =
          lerpColor(
            paletteA.colors[i],
            paletteB.colors[i],
            scroll.mix
          );

        field.style.background =
          `radial-gradient(
            circle,
            rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.96) 0%,
            rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.72) 28%,
            rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.00) 70%
          )`;

      });


      /* -------------------------------
         POINTER IDLE LOGIC
      -------------------------------- */

      const now =
        performance.now();


      if (
        pointer.active &&
        now - pointer.lastMove > 900
      ) {

        pointer.active = false;

        pointer.idleStart = now;

      }


      if (!pointer.active) {

        const idleDuration =
          now - pointer.idleStart;


        /*
          First, the light returns toward center.

          After it settles, it begins an extremely
          slow autonomous drift.
        */

        if (idleDuration < 2600) {

          pointer.targetX =
            width * 0.5;

          pointer.targetY =
            height * 0.5;

        }

        else {

          pointer.targetX =
            width * (
              0.5 +
              Math.sin(time * 0.00012) * 0.07
            );

          pointer.targetY =
            height * (
              0.5 +
              Math.cos(time * 0.000095) * 0.055
            );

        }

      }


      /* -------------------------------
         POINTER INERTIA
      -------------------------------- */

      const pointerSpeed =
        pointer.active
          ? 0.145
          : 0.035;


      pointer.x +=
        (pointer.targetX - pointer.x) *
        pointerSpeed;

      pointer.y +=
        (pointer.targetY - pointer.y) *
        pointerSpeed;


      light.style.left =
        pointer.x + "px";

      light.style.top =
        pointer.y + "px";


      /* -------------------------------
         NORMALIZED POINTER INFLUENCE
      -------------------------------- */

      const influenceX =
        (pointer.x / width - 0.5);

      const influenceY =
        (pointer.y / height - 0.5);


      /* -------------------------------
         COLOR FIELD MOTION
      -------------------------------- */

      fields.forEach((field, i) => {

        const config =
          fieldMotion[i];


        let motionX =
          Math.sin(
            time * config.speed +
            config.phase
          );

        let motionY =
          Math.cos(
            time *
            config.speed *
            0.83 +
            config.phase
          );


        /*
          Pointer subtly bends the whole field.
          Each layer responds differently.
        */

        const response =
          ((i % 3) + 1) * 0.026;


        const x =
          motionX *
          width *
          config.radiusX +

          influenceX *
          width *
          response;


        const y =
          motionY *
          height *
          config.radiusY +

          influenceY *
          height *
          response;


        /*
          Scrolling also slightly changes the
          geometry, not only the colors.
        */

        const scrollShift =
          Math.sin(
            scroll.progress *
            Math.PI *
            3 +
            i
          ) *
          50;


        const scale =
          1 +
          Math.sin(
            time * config.speed * 0.5 +
            config.phase
          ) *
          0.08;


        field.style.transform =
          `
            translate(
              calc(-50% + ${x}px),
              calc(-50% + ${y + scrollShift}px)
            )
            scale(${scale})
          `;

      });


      /* -------------------------------
         RIPPLES
      -------------------------------- */

      drawRipples();


      requestAnimationFrame(animate);

    }


    requestAnimationFrame(animate);

  </script>

</body>
</html>
