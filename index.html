<script>
  const gradient = document.getElementById("gradient");

  let targetX = 50;
  let targetY = 50;

  let currentX = 50;
  let currentY = 50;

  let inactivityTimer;
  let isInteracting = false;

  const idleDelay = 1200; // milliseconds before returning to center

  function setTarget(x, y) {
    targetX = x;
    targetY = y;

    clearTimeout(inactivityTimer);

    inactivityTimer = setTimeout(() => {
      targetX = 50;
      targetY = 50;
      isInteracting = false;
    }, idleDelay);
  }

  function animate() {
    // Move faster while actively following the cursor/finger
    // and slightly slower when drifting back to center.
    const speed = isInteracting ? 0.16 : 0.045;

    currentX += (targetX - currentX) * speed;
    currentY += (targetY - currentY) * speed;

    gradient.style.setProperty("--x", `${currentX}%`);
    gradient.style.setProperty("--y", `${currentY}%`);

    requestAnimationFrame(animate);
  }

  // DESKTOP
  document.addEventListener("mousemove", (event) => {
    isInteracting = true;

    const x = (event.clientX / window.innerWidth) * 100;
    const y = (event.clientY / window.innerHeight) * 100;

    setTarget(x, y);
  });

  // MOBILE
  document.addEventListener(
    "touchstart",
    (event) => {
      isInteracting = true;

      const touch = event.touches[0];

      const x = (touch.clientX / window.innerWidth) * 100;
      const y = (touch.clientY / window.innerHeight) * 100;

      setTarget(x, y);
    },
    { passive: true }
  );

  document.addEventListener(
    "touchmove",
    (event) => {
      isInteracting = true;

      const touch = event.touches[0];

      const x = (touch.clientX / window.innerWidth) * 100;
      const y = (touch.clientY / window.innerHeight) * 100;

      setTarget(x, y);
    },
    { passive: true }
  );

  document.addEventListener(
    "touchend",
    () => {
      clearTimeout(inactivityTimer);

      inactivityTimer = setTimeout(() => {
        targetX = 50;
        targetY = 50;
        isInteracting = false;
      }, 200);
    },
    { passive: true }
  );

  document.addEventListener(
    "touchcancel",
    () => {
      targetX = 50;
      targetY = 50;
      isInteracting = false;
    },
    { passive: true }
  );

  animate();
</script>
