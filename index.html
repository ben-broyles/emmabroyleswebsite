<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Happy Birthday Emma!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      color: white;
      background:
        radial-gradient(circle at top, #ff8fc7, transparent 45%),
        linear-gradient(135deg, #7d3cff, #ff4f9a);
    }

    #startScreen h1 {
      margin: 0 0 24px;
      font-size: clamp(2.5rem, 11vw, 5rem);
      line-height: 1.05;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    #startButton {
      min-width: 180px;
      padding: 18px 30px;
      border: 0;
      border-radius: 999px;
      background: white;
      color: #b12670;
      font-size: 1.35rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      touch-action: manipulation;
    }

    #startButton:active {
      transform: scale(0.97);
    }

    #birthdayVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      display: none;
    }

    #errorMessage {
      max-width: 500px;
      margin-top: 20px;
      display: none;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <div id="startScreen">
    <h1>🎉 Happy Birthday Emma! 🎂</h1>
    <button id="startButton" type="button">Click Here</button>
    <p id="errorMessage">
      The video could not start. Please tap the button again.
    </p>
  </div>

  <video
    id="birthdayVideo"
    loop
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source src="birthday-video.mp4" type="video/mp4">
    Your browser does not support HTML video.
  </video>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const video = document.getElementById("birthdayVideo");
    const errorMessage = document.getElementById("errorMessage");

    startButton.addEventListener("click", async () => {
      errorMessage.style.display = "none";

      video.style.display = "block";
      video.muted = false;
      video.volume = 1;
      video.currentTime = 0;

      try {
        await video.play();
        startScreen.style.display = "none";
      } catch (error) {
        video.style.display = "none";
        errorMessage.style.display = "block";
        console.error("Video playback failed:", error);
      }
    });
  </script>
</body>
</html>
