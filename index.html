<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Emma Broyles</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        Helvetica, Arial, sans-serif;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255, 255, 255, 0.95),
          rgba(245, 244, 241, 0.8) 45%,
          #eeece8 100%
        );

      color: #181818;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .name {
      font-size: clamp(2.2rem, 5vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1;
      text-align: center;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeIn 1.2s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="name">Emma Broyles</div>
  </main>
</body>
</html>
